# Builds and deploys the site on every push to main, after each collection run, and once a day
# (so 開催中/開催予定 stay current). Then sends LINE notifications for newly announced exhibitions.
# Needs repository secrets CLOUDFLARE_API_TOKEN (permissions: Cloudflare Pages Edit, D1 Edit) and CLOUDFLARE_ACCOUNT_ID;
# LINE_CHANNEL_SECRET and LINE_CHANNEL_ACCESS_TOKEN turn on the LINE bot.
name: build-and-deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '5 15 * * *'
  # Pushes made by the collect workflow don't trigger 'push', so rebuild when it finishes.
  workflow_run:
    workflows: [collect-exhibitions]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SITE: https://artping.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Create the Pages project and database if needed
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          npx wrangler@3 pages project create artist-calendar --production-branch=main || true
          npx wrangler@3 d1 create artist-calendar || true
          DB_ID=$(npx wrangler@3 d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="artist-calendar");process.stdout.write(d?(d.uuid||d.database_id):"")') || DB_ID=""
          if [ -n "$DB_ID" ]; then
            npx wrangler@3 d1 execute artist-calendar --remote --file=schema.sql
            printf 'name = "artist-calendar"\npages_build_output_dir = "dist"\ncompatibility_date = "2025-01-01"\n\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "artist-calendar"\ndatabase_id = "%s"\n' "$DB_ID" > wrangler.toml
          else
            echo "::warning::D1 database unavailable (does the Cloudflare token have D1 Edit?). LINE features stay off."
          fi
      - name: Export shown visitor comments for the pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          [ -f wrangler.toml ] || exit 0
          npx wrangler@3 d1 execute artist-calendar --remote --json --command "SELECT id, exhibition_id, name, body, created_at FROM comments WHERE status = 'ok' ORDER BY id DESC" > "$RUNNER_TEMP/comments.json" || exit 0
          node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const rows=(Array.isArray(p)?p:[p]).flatMap(r=>r.results??[]);require("fs").writeFileSync("data/comments.json",JSON.stringify(rows));console.log(rows.length+" comments")' "$RUNNER_TEMP/comments.json"
      - run: npm test
      - run: npm run build
      - name: Pass the LINE keys to the site
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.LINE_CHANNEL_SECRET != '' }}
        run: |
          printf '%s' "$LINE_CHANNEL_SECRET" | npx wrangler@3 pages secret put LINE_CHANNEL_SECRET --project-name=artist-calendar
          printf '%s' "$LINE_CHANNEL_ACCESS_TOKEN" | npx wrangler@3 pages secret put LINE_CHANNEL_ACCESS_TOKEN --project-name=artist-calendar
      - name: Pass the Claude key to the site (checks visitor comments)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.ANTHROPIC_API_KEY != '' }}
        run: printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler@3 pages secret put ANTHROPIC_API_KEY --project-name=artist-calendar
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler@3 pages deploy dist --project-name=artist-calendar --branch=main
      - name: Send LINE notifications for new exhibitions
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.LINE_CHANNEL_SECRET != '' }}
        run: |
          [ -f wrangler.toml ] || { echo "::warning::No database yet, so no notifications were sent."; exit 0; }
          sleep 20
          KEY=$(printf '%s' "$LINE_CHANNEL_SECRET:notify" | sha256sum | cut -d' ' -f1)
          curl -sS --fail-with-body -X POST "$SITE/api/notify" -H "authorization: Bearer $KEY"
      - name: File venue requests from the site as a GitHub issue
        if: ${{ !cancelled() && env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f wrangler.toml ] || exit 0
          npx wrangler@3 d1 execute artist-calendar --remote --json --command "SELECT id, name, url, note, created_at FROM venue_requests WHERE reported = 0 ORDER BY id" > "$RUNNER_TEMP/req.json"
          node scripts/requests-issue.mjs "$RUNNER_TEMP/req.json" "$RUNNER_TEMP/req.md" "$RUNNER_TEMP/req-ids.txt"
          [ -s "$RUNNER_TEMP/req-ids.txt" ] || exit 0
          gh label create venue-request --force >/dev/null
          gh issue create --title "施設のリクエスト $(date -u +%F)" --label venue-request --body-file "$RUNNER_TEMP/req.md"
          npx wrangler@3 d1 execute artist-calendar --remote --command "UPDATE venue_requests SET reported = 1 WHERE id IN ($(cat "$RUNNER_TEMP/req-ids.txt"))"
