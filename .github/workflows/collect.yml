# Daily read of every museum's official exhibition list (05:30 JST).
# Only pages that changed are sent to Claude. New exhibitions are committed to main, which triggers a rebuild.
# Needs repository secret ANTHROPIC_API_KEY.
name: collect-exhibitions
on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: '読む館のID（カンマ区切り、空なら全館）'
        required: false
        default: ''
      force:
        description: 'ページが変わっていなくても読み直す'
        type: boolean
        default: false
      debug:
        description: 'ページの中身と読み取り結果をログに出す'
        type: boolean
        default: false
      describe_venues:
        description: '紹介文を書く施設の数（1回あたり）'
        required: false
        default: '20'
      describe_exhibitions:
        description: '紹介文を書く展覧会の数（1回あたり）'
        required: false
        default: '60'
      enrich_venues:
        description: '住所・アクセス・取り扱い作家を調べる施設の数（1回あたり）'
        required: false
        default: '15'
      enrich_artists:
        description: '紹介文を書く作家の数（1回あたり）'
        required: false
        default: '20'
      baseline:
        description: '見つかった展覧会を新着として通知しない'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/collect.mjs ${ONLY:+--only=$ONLY} ${{ inputs.force && '--force' || '' }} ${{ inputs.debug && '--debug' || '' }} ${{ inputs.baseline && '--baseline' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ONLY: ${{ inputs.only }}
      - name: Add readings (hiragana) for new names
        run: node scripts/readings.mjs
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Write descriptions for new venues and exhibitions
        run: node scripts/describe.mjs --venues=${VENUES:-20} --exhibitions=${EXHIBITIONS:-60}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VENUES: ${{ inputs.describe_venues }}
          EXHIBITIONS: ${{ inputs.describe_exhibitions }}
      - name: Add venue access info, gallery artist lists, artist profiles and month notes
        run: node scripts/enrich.mjs --venues=${VENUES:-15} --galleries=${VENUES:-15} --artists=${ARTISTS:-20}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VENUES: ${{ inputs.enrich_venues }}
          ARTISTS: ${{ inputs.enrich_artists }}
      - name: Save results to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Collect: $(date -u +%F)" && git pull --rebase origin main && git push)
      - name: Raise an issue for museums that keep failing
        if: hashFiles('data/monitor/alerts.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s data/monitor/alerts.md ] || exit 0
          existing=$(gh issue list --label collect-alert --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body-file data/monitor/alerts.md
          else gh label create collect-alert --force >/dev/null; gh issue create --title "美術館のページが読めません" --label collect-alert --body-file data/monitor/alerts.md; fi
